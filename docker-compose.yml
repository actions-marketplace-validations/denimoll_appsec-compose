# appsec-compose — one-command OSS AppSec scan.
#
# Driven by ./run.sh, which renders scan-config.yml into .env (image versions +
# online/offline flags) and runs only the enabled scanners followed by the
# collector. Each scanner is a one-shot service that writes a native report into
# the shared ./reports volume and ALWAYS exits 0 (findings never break the scan
# phase). The collector normalizes the reports and decides pass/fail — its exit
# code is the only meaningful one.
#
# Image versions and the *_RULES / *_FLAGS below come from .env (see
# scripts/render-env.py); the defaults here keep raw `docker compose` working.
# run.sh renders a private .env per run and passes it with --env-file; it also
# points ASS_EXCLUDES_DIR / ASS_ARCHIVE_DIR at that run's directory. Their
# defaults (./excludes, ./.img-archive) are where a plain `render-env.py` writes.
# ASS_CACHE_DIR (default ./cache) holds the vulnerability DBs; the
# `appsec-compose` CLI moves it to the user's cache dir.

name: appsec-compose

x-code-mount: &code-mount
  type: bind
  source: ${SCAN_TARGET:?set SCAN_TARGET to the absolute path of the repo to scan}
  target: /code
  read_only: true

# The repo in, the reports out — what every scanner needs and nothing more.
x-scan-volumes: &scan-volumes
  - *code-mount
  - ${ASS_REPORTS_DIR:-./reports}:/reports

# Extra mounts for the scanners that can also target a container image.
x-image-volumes: &image-volumes
  - *code-mount
  - ${ASS_REPORTS_DIR:-./reports}:/reports
  - ${ASS_ARCHIVE_DIR:-./.img-archive}:/archive:ro
  - ${ASS_DOCKER_CONFIG:-./.img-empty}:/dockercfg:ro

# Diff mode (./run.sh --diff <ref>): the engines that read files see a copy of
# only what the change touched, mounted at /code in place of the repo, so their
# command lines and report paths stay those of a full scan. ASS_DIFF_TREE holds
# the changed files; ASS_DIFF_IAC_TREE the changed IaC files plus the Terraform
# files beside them. Outside diff mode both fall back to the repo itself.
x-diff-code-mount: &diff-code-mount
  type: bind
  source: ${ASS_DIFF_TREE:-${SCAN_TARGET:?set SCAN_TARGET to the absolute path of the repo to scan}}
  target: /code
  read_only: true

x-iac-code-mount: &iac-code-mount
  type: bind
  source: ${ASS_DIFF_IAC_TREE:-${SCAN_TARGET:?set SCAN_TARGET to the absolute path of the repo to scan}}
  target: /code
  read_only: true

x-iac-volumes: &iac-volumes
  - *iac-code-mount
  - ${ASS_REPORTS_DIR:-./reports}:/reports

# Generated per-engine configs (gitleaks TOML, trufflehog regex list, zizmor
# fallback policy).
x-exclude-volumes: &exclude-volumes
  - *diff-code-mount
  - ${ASS_REPORTS_DIR:-./reports}:/reports
  - ${ASS_EXCLUDES_DIR:-./excludes}:/excludes:ro

# Every scanner runs one shot through a shell and must exit 0: findings are the
# collector's business, so a noisy engine never breaks the scan phase.
x-sh: &sh
  entrypoint: ["/bin/sh", "-c"]

services:
  # ---- SAST -------------------------------------------------------------
  semgrep:
    image: ${SEMGREP_IMAGE:-semgrep/semgrep:1.183.0}
    <<: *sh
    # SEMGREP_CONFIGS = one or more `--config <ref>` built by render-env from
    # scan-config.yml (default pack, custom registry refs, `auto` stack-detect,
    # and the local ./semgrep-rules drop-in dir mounted at /semgrep-rules).
    command:
      - >-
        set -f;
        semgrep scan $$SEMGREP_CONFIGS $$SEMGREP_EXCLUDES --metrics off
        --sarif --output /reports/native/semgrep.sarif /code || true
    environment:
      SEMGREP_CONFIGS: ${SEMGREP_CONFIGS:---config p/default}
      SEMGREP_EXCLUDES: ${SEMGREP_EXCLUDES:-}
    volumes:
      - *diff-code-mount
      - ${ASS_REPORTS_DIR:-./reports}:/reports
      - ${ASS_CACHE_DIR:-./cache}/semgrep:/cache/semgrep
      - ./semgrep-rules:/semgrep-rules:ro

  # ---- SCA + IaC + SBOM (Trivy covers all three) ------------------------
  # Scans the repo filesystem, or a container image when ASS_IMAGE is set
  # (./run.sh --image <ref>). SBOM formats are controlled by ASS_SBOM_CDX/SPDX.
  # Diff mode: SCA (and its SBOM) runs only when a manifest changed
  # (ASS_DIFF_SCA), over the whole repo; the config scan reads only the changed
  # IaC files, mounted at /iac (ASS_DIFF_IAC).
  trivy:
    image: ${TRIVY_IMAGE:-aquasec/trivy:0.76.1}
    <<: *sh
    command:
      - |
        set -f
        if [ -n "$$ASS_IMAGE_TAR" ]; then SRC=image; SRCARG="--input $$ASS_IMAGE_TAR"; SKIP=;
        elif [ -n "$$ASS_IMAGE" ]; then SRC=image; SRCARG="$$ASS_IMAGE"; SKIP=;
        else SRC=fs; SRCARG=/code; SKIP=$$TRIVY_SKIP_DIRS; fi
        CFG=/code; [ "$$ASS_DIFF" = 1 ] && CFG=/iac
        if [ "$$ASS_DIFF_SCA" != 0 ]; then
        trivy $$SRC --quiet $$TRIVY_DB_FLAGS $$SKIP --scanners vuln,secret --format sarif --output /reports/native/trivy-fs.sarif $$SRCARG
        [ "$$ASS_SBOM_CDX" = "1" ] && trivy $$SRC --quiet $$TRIVY_DB_FLAGS $$SKIP --format cyclonedx --output /reports/sbom.trivy.cdx.json $$SRCARG || true
        [ "$$ASS_SBOM_SPDX" = "1" ] && trivy $$SRC --quiet $$TRIVY_DB_FLAGS $$SKIP --format spdx-json --output /reports/sbom.trivy.spdx.json $$SRCARG || true
        fi
        [ "$$SRC" = fs ] && [ "$$ASS_DIFF_IAC" != 0 ] && trivy config --quiet $$SKIP --format sarif --output /reports/native/trivy-config.sarif $$CFG || true
        [ "$$ASS_LICENSES" = "1" ] && trivy $$SRC --quiet $$TRIVY_DB_FLAGS $$SKIP --scanners license --list-all-pkgs --format json --output /reports/native/trivy-license.json $$SRCARG || true
    environment:
      # Nothing leaves the machine but the DB download: Trivy otherwise sends
      # anonymous usage data to Aqua and checks for announcements on every run.
      TRIVY_DISABLE_TELEMETRY: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
      TRIVY_DB_FLAGS: ${TRIVY_DB_FLAGS:-}
      TRIVY_SKIP_DIRS: ${TRIVY_SKIP_DIRS:-}
      ASS_IMAGE: ${ASS_IMAGE:-}
      ASS_IMAGE_TAR: ${ASS_IMAGE_TAR:-}
      ASS_SBOM_CDX: ${ASS_SBOM_CDX:-1}
      ASS_SBOM_SPDX: ${ASS_SBOM_SPDX:-0}
      ASS_DIFF: ${ASS_DIFF:-}
      ASS_DIFF_SCA: ${ASS_DIFF_SCA:-}
      ASS_DIFF_IAC: ${ASS_DIFF_IAC:-}
      ASS_LICENSES: ${ASS_LICENSES:-0}
      DOCKER_CONFIG: /dockercfg
    volumes:
      - *code-mount
      - ${ASS_DIFF_IAC_TREE:-./.img-empty}:/iac:ro
      - ${ASS_REPORTS_DIR:-./reports}:/reports
      - ${ASS_CACHE_DIR:-./cache}/trivy:/root/.cache/trivy
      - ${ASS_ARCHIVE_DIR:-./.img-archive}:/archive:ro
      - ${ASS_DOCKER_CONFIG:-./.img-empty}:/dockercfg:ro

  # ---- Secrets ----------------------------------------------------------
  gitleaks:
    image: ${GITLEAKS_IMAGE:-zricethezav/gitleaks:v8.30.1}
    <<: *sh
    # The working tree (`dir`) always; with secrets_history (ASS_SECRETS_HISTORY)
    # a second pass walks the commits of the real repo at /repo (narrowed by
    # GITLEAKS_HISTORY_OPTS = secrets_history_range). --exit-code 0 keeps it green.
    # Do not go back to `detect`: it survives as a deprecated alias that exits 0
    # and writes an empty report, i.e. it silently finds nothing.
    # --redact: this SARIF is uploaded to code scanning and kept as a CI
    # artifact, and must not carry the secret it reports.
    # Diff mode: /code holds only the changed files (working-tree pass), and a
    # second pass walks the branch's commits in the real repo at /repo
    # (ASS_DIFF_LOG_OPTS = merge-base..HEAD) into gitleaks-history.sarif, so a
    # secret committed and then removed on the branch is still reported.
    command:
      - >-
        set -f;
        gitleaks $$GITLEAKS_CMD /code --config=/excludes/gitleaks.toml
        --redact --report-format=sarif --report-path=/reports/native/gitleaks.sarif --exit-code=0;
        [ -z "$$ASS_DIFF_LOG_OPTS$$ASS_SECRETS_HISTORY" ] ||
        gitleaks git /repo --config=/excludes/gitleaks.toml $$ASS_DIFF_LOG_OPTS $$GITLEAKS_HISTORY_OPTS
        --redact --report-format=sarif --report-path=/reports/native/gitleaks-history.sarif --exit-code=0
    environment:
      GITLEAKS_CMD: ${GITLEAKS_CMD:-dir}
      GITLEAKS_HISTORY_OPTS: ${GITLEAKS_LOG_OPTS:-}
      ASS_SECRETS_HISTORY: ${ASS_SECRETS_HISTORY:-}
      ASS_DIFF_LOG_OPTS: ${ASS_DIFF_LOG_OPTS:-}
    volumes:
      - *diff-code-mount
      - ${ASS_REPORTS_DIR:-./reports}:/reports
      - ${ASS_EXCLUDES_DIR:-./excludes}:/excludes:ro
      - ${SCAN_TARGET:?set SCAN_TARGET to the absolute path of the repo to scan}:/repo:ro

  # ---- IaC (deeper policy coverage than Trivy config) -------------------
  checkov:
    image: ${CHECKOV_IMAGE:-bridgecrew/checkov:3.4.0}
    <<: *sh
    # checkov prints an ASCII banner to stdout, so we can't redirect stdout to
    # the report. Write to a dir (clean `results_sarif.sarif`) and rename it.
    # --skip-framework secrets: Gitleaks and Trivy own secrets. Checkov's own
    # pass reads every file — 27 of a 44 s scan on juice-shop — and its hits
    # landed as IaC findings, under the wrong gate and never merged; the ones
    # only it found there were high-entropy words in translation files.
    # CHECKOV_FRAMEWORKS (render-env) names the frameworks the repo has files
    # for: Checkov walks the whole tree once per framework, files or not.
    # "all" keeps every framework but secrets; "none" means no IaC at all, so
    # Checkov is not started and its report is an empty, valid SARIF.
    command:
      - >-
        set -f;
        if [ "$$CHECKOV_FRAMEWORKS" = none ]; then
        printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Checkov"}},"results":[]}]}'
        > /reports/native/checkov.sarif; exit 0; fi;
        if [ "$$CHECKOV_FRAMEWORKS" = all ]; then FW="--skip-framework secrets";
        else FW="--framework $$CHECKOV_FRAMEWORKS"; fi;
        checkov -d /code --soft-fail --compact $$FW $$CHECKOV_DOWNLOAD $$CHECKOV_SKIP_PATHS -o sarif
        --output-file-path /reports/native/_checkov >/dev/null 2>&1 || true ;
        mv /reports/native/_checkov/results_sarif.sarif /reports/native/checkov.sarif 2>/dev/null || true ;
        rm -rf /reports/native/_checkov
    environment:
      CHECKOV_SKIP_PATHS: ${CHECKOV_SKIP_PATHS:-}
      CHECKOV_FRAMEWORKS: ${CHECKOV_FRAMEWORKS:-all}
      # --skip-download unless `guidelines: true`: fetching Prisma Cloud's
      # guideline links costs about 25 s per run (and hangs offline); the
      # findings and their levels are identical without it.
      CHECKOV_DOWNLOAD: ${CHECKOV_DOWNLOAD:---skip-download}
    volumes: *iac-volumes

  # ---- SCA (alternative) -----------------------------------------------
  grype:
    image: ${GRYPE_IMAGE:-anchore/grype:v0.121.0}
    # entrypoint is `grype`; default exit code is 0. SARIF is the native ASPM
    # artifact; the JSON carries relatedVulnerabilities (GHSA<->CVE aliases) and
    # package info that the collector uses for cross-tool SCA de-duplication.
    # Target is dir:/code, or a container image when ASS_GRYPE_TARGET is set.
    command:
      - "${ASS_GRYPE_TARGET:-dir:/code}"
      - "-o"
      - "sarif=/reports/native/grype.sarif"
      - "-o"
      - "json=/reports/native/grype.json"
      - "-q"
    environment:
      GRYPE_DB_CACHE_DIR: /cache/grype
      GRYPE_CHECK_FOR_APP_UPDATE: "false"    # no call home on every run
      GRYPE_EXCLUDE: ${GRYPE_EXCLUDE:-}
      GRYPE_DB_AUTO_UPDATE: ${GRYPE_DB_AUTO_UPDATE:-true}
      DOCKER_CONFIG: /dockercfg
    volumes:
      - *code-mount
      - ${ASS_REPORTS_DIR:-./reports}:/reports
      - ${ASS_CACHE_DIR:-./cache}/grype:/cache/grype
      - ${ASS_ARCHIVE_DIR:-./.img-archive}:/archive:ro
      - ${ASS_DOCKER_CONFIG:-./.img-empty}:/dockercfg:ro

  # ---- Secrets (alternative) -------------------------------------------
  trufflehog:
    image: ${TRUFFLEHOG_IMAGE:-trufflesecurity/trufflehog:3.99.7}
    <<: *sh
    # TruffleHog has no SARIF output; it emits JSON lines. We keep the raw JSON
    # as the native report and the collector generates trufflehog.sarif from it.
    # TRUFFLEHOG_VERIFY is --no-verification unless `verify: true`: verifying
    # sends each candidate secret to its issuer.
    command:
      - >-
        trufflehog filesystem /code --json --no-update $$TRUFFLEHOG_VERIFY
        -x /excludes/trufflehog.txt
        > /reports/native/trufflehog.json 2>/dev/null || true
    environment:
      TRUFFLEHOG_VERIFY: ${TRUFFLEHOG_VERIFY:---no-verification}
    volumes: *exclude-volumes

  # ---- SBOM (alternative generator) ------------------------------------
  # Emits both CycloneDX and SPDX. Target is dir:/code or a container image.
  syft:
    image: ${SYFT_IMAGE:-anchore/syft:v1.55.0}
    command:
      - "scan"
      - "${ASS_SYFT_TARGET:-dir:/code}"
      - "-o"
      - "cyclonedx-json=/reports/sbom.syft.cdx.json"
      - "-o"
      - "spdx-json=/reports/sbom.syft.spdx.json"
      - "-q"
    environment:
      DOCKER_CONFIG: /dockercfg
      SYFT_CHECK_FOR_APP_UPDATE: "false"     # no call home on every run
      SYFT_EXCLUDE: ${SYFT_EXCLUDE:-}
    volumes: *image-volumes

  # ---- IaC (Dockerfile lint) -------------------------------------------
  hadolint:
    image: ${HADOLINT_IMAGE:-hadolint/hadolint:v2.15.1-alpine}
    <<: *sh
    # Lint every Dockerfile in the repo; --no-fail keeps the container green.
    # Empty SARIF when none are found.
    command:
      - >-
        set -f;
        files=$$(find /code -type f \( -iname 'Dockerfile' -o -iname 'Dockerfile.*' -o -iname '*.Dockerfile' \) $$HADOLINT_PRUNE 2>/dev/null);
        if [ -n "$$files" ]; then hadolint --no-fail --format sarif $$files > /reports/native/hadolint.sarif 2>/dev/null;
        else printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Hadolint"}},"results":[]}]}' > /reports/native/hadolint.sarif; fi
    environment:
      HADOLINT_PRUNE: ${HADOLINT_PRUNE:-}
    volumes: *iac-volumes

  kics:
    image: ${KICS_IMAGE:-checkmarx/kics:v2.2.0}
    <<: *sh
    # Checkmarx KICS: a second IaC policy engine. Runs without network
    # (verified with --network none). --disable-secrets: Gitleaks and Trivy
    # own secrets. --ignore-on-exit all: findings never fail the container.
    # It honours .gitignore itself. Reports land in a scratch dir and are
    # renamed, as with Checkov.
    command:
      - >-
        set -f;
        kics scan -p /code -o /reports/native/_kics --report-formats sarif
        --output-name kics --ignore-on-exit all --disable-secrets
        --no-progress --ci --no-color $$KICS_EXCLUDES >/dev/null 2>&1 || true;
        mv /reports/native/_kics/kics.sarif /reports/native/kics.sarif 2>/dev/null || true;
        rm -rf /reports/native/_kics
    environment:
      KICS_EXCLUDES: ${KICS_EXCLUDES:-}
    volumes: *iac-volumes

  # ---- SCA (alternative, OSV database) ---------------------------------
  osv:
    image: ${OSV_IMAGE:-ghcr.io/google/osv-scanner:v2.7.0}
    <<: *sh
    # OSV ruleId is the CVE, so findings de-duplicate against Trivy/Grype.
    # Needs network (queries the OSV database); not for offline mode.
    # A repo with no dependency manifests makes osv-scanner exit without writing
    # anything, so fall back to an empty SARIF: "nothing to scan" is a clean
    # result, not a missing report.
    command:
      - >-
        set -f;
        /osv-scanner scan source --recursive $$OSV_EXCLUDES --format sarif
        --output-file /reports/native/osv.sarif /code || true;
        [ -s /reports/native/osv.sarif ] ||
        printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner"}},"results":[]}]}'
        > /reports/native/osv.sarif
    environment:
      OSV_EXCLUDES: ${OSV_EXCLUDES:-}
    volumes: *scan-volumes

  # ---- CI/CD (GitHub Actions workflows, composite actions, Dependabot) ----
  # zizmor has no exclusion flag, so its inputs are collected here with the
  # same `exclude:` list as every other engine (ZIZMOR_PRUNE) and passed as
  # files; NUL-separated, so a workflow name with a space survives. A repo with
  # nothing to audit gets an empty SARIF rather than zizmor's "no inputs" exit 3.
  # Policy: the repo's own zizmor.yml when it has one (zizmor finds it next to
  # the inputs), else the fallback render-env generates (/excludes/zizmor.yml).
  # --format sarif already keeps findings out of the exit code.
  zizmor:
    image: ${ZIZMOR_IMAGE:-ghcr.io/zizmorcore/zizmor:1.31.1}
    <<: *sh
    command:
      - >-
        set -f;
        find /code -type f \( -path '*/.github/workflows/*.yml' -o -path '*/.github/workflows/*.yaml'
        -o -name action.yml -o -name action.yaml
        -o -path '*/.github/dependabot.yml' -o -path '*/.github/dependabot.yaml' \)
        $$ZIZMOR_PRUNE -print0 2>/dev/null > /tmp/inputs;
        cfg="--config /excludes/zizmor.yml";
        for c in /code/zizmor.yml /code/zizmor.yaml /code/.github/zizmor.yml /code/.github/zizmor.yaml;
        do [ -f "$$c" ] && cfg=""; done;
        [ -n "$$ASS_ZIZMOR_TOKEN" ] && export ZIZMOR_GITHUB_TOKEN="$$ASS_ZIZMOR_TOKEN";
        if [ -s /tmp/inputs ]; then
        xargs -0 zizmor --quiet $$ZIZMOR_FLAGS $$cfg --format sarif < /tmp/inputs > /reports/native/zizmor.sarif || true;
        else printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"zizmor"}},"results":[]}]}'
        > /reports/native/zizmor.sarif; fi
    environment:
      ZIZMOR_FLAGS: ${ZIZMOR_FLAGS:-}
      ZIZMOR_PRUNE: ${ZIZMOR_PRUNE:-}
      # Opt-in online audits: export ZIZMOR_GITHUB_TOKEN on the host. Renamed
      # on the way in because zizmor rejects the variable when it is set but
      # empty, which is what an unset host variable becomes here.
      ASS_ZIZMOR_TOKEN: ${ZIZMOR_GITHUB_TOKEN:-}
    volumes: *exclude-volumes

  # ---- Collector / orchestrator ----------------------------------------
  # run.sh invokes this with `--no-deps` after the enabled scanners finish.
  # depends_on is kept so a raw `docker compose run collector` still works.
  collector:
    # run.sh resolves ASS_COLLECTOR_IMAGE before the scan (scripts/collector-
    # image.sh): the published GHCR image when it matches this checkout's
    # orchestrator/, else a local build — so it never relies on compose to
    # build or pull. `build:` is what a raw `docker compose run collector` uses.
    image: ${ASS_COLLECTOR_IMAGE:-appsec-compose-collector:local}
    build: ./orchestrator
    # Non-root; run.sh supplies the host uid/gid so the bind-mounted reports/
    # and baseline file stay writable.
    user: "${ASS_UID:-65532}:${ASS_GID:-65532}"
    depends_on:
      semgrep:  { condition: service_completed_successfully }
      trivy:    { condition: service_completed_successfully }
      gitleaks: { condition: service_completed_successfully }
      checkov:  { condition: service_completed_successfully }
    environment:
      FAIL_ON: ${FAIL_ON:-}
      ASS_UPDATE_BASELINE: ${ASS_UPDATE_BASELINE:-}
      ASS_IMAGE: ${ASS_IMAGE:-}
      ASS_IMAGE_TAR: ${ASS_IMAGE_TAR:-}
      ASS_ENABLED: ${ASS_ENABLED:-}
      ASS_STRICT: ${ASS_STRICT:-}
      ASS_MIN_CONFIDENCE: ${ASS_MIN_CONFIDENCE:-}
      ASS_SECRETS_HISTORY: ${ASS_SECRETS_HISTORY:-}
      ASS_EXCLUDES: ${ASS_EXCLUDES:-}
      ASS_GITIGNORED: ${ASS_GITIGNORED:-}
      ASS_WORKTREES: ${ASS_WORKTREES:-}
      ASS_REPORTS_HOST: ${ASS_REPORTS_HOST:-}
      # Key for the CVE-PaaS enrichment; passed through from the host env so it
      # never has to live in scan-config.yml.
      CVE_PAAS_API_KEY: ${CVE_PAAS_API_KEY:-}
      ASS_VERSION: ${ASS_VERSION:-}
      ASS_ENGINE_IMAGES: ${ASS_ENGINE_IMAGES:-}
      ASS_DB_DATES: ${ASS_DB_DATES:-}
      ASS_ENGINE_TIMINGS: ${ASS_ENGINE_TIMINGS:-}
      ASS_REPO_CONFIG: ${ASS_REPO_CONFIG:-}
      CHECKOV_FRAMEWORKS: ${CHECKOV_FRAMEWORKS:-all}
      ASS_SCAN_SECONDS: ${ASS_SCAN_SECONDS:-}
      ASS_RUN_START: ${ASS_RUN_START:-}
      # Diff mode: /diff/scope.json says what changed and what was skipped.
      ASS_DIFF: ${ASS_DIFF:-}
      ASS_ZIZMOR_ONLINE: ${ASS_ZIZMOR_ONLINE:-}
    # Lets `url: http://host.docker.internal:8000` reach a CVE-PaaS running on
    # the host from Linux too (a no-op on Docker Desktop, which already has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only code mount: the collector compares the manifests the repo
      # declares against what the SCA engines actually resolved.
      - *code-mount
      - ${ASS_REPORTS_DIR:-./reports}:/reports
      - ${ASS_CONFIG_FILE:-./scan-config.yml}:/app/scan-config.yml:ro
      - ${ASS_BASELINE_FILE:-./appsec-baseline.json}:/app/appsec-baseline.json
      - ${ASS_DIFF_DIR:-./.img-empty}:/diff:ro
