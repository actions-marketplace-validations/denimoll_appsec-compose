# appsec-compose — this repository's own pipeline.
#
# Other projects include the reusable template instead:
# templates/gitlab/appsec-compose.yml. Its header carries the runner
# requirement (the host Docker socket, not dind — the daemon must see the
# checkout on the same path as the job). This pipeline includes that same
# template and points it at this checkout rather than fetching a release.

include:
  - local: templates/gitlab/appsec-compose.yml

stages: [test, scan]

# The collector decides what merges, what is suppressed and whether the build
# fails, so its logic is tested before it is trusted to gate anything.
appsec-compose:tests:
  stage: test
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir -r tests/requirements.txt
  script:
    - python -m pytest tests/ -q

appsec-compose:
  stage: scan
  needs: ["appsec-compose:tests"]
  variables:
    # Dogfood the checkout under test, not a published release.
    APPSEC_COMPOSE_DIR: $CI_PROJECT_DIR
