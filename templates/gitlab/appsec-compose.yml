# appsec-compose — GitLab CI template for any project.
#
# Include it from your .gitlab-ci.yml (pin the include AND the tool ref):
#
#   include:
#     - remote: https://raw.githubusercontent.com/denimoll/appsec-compose/v.1.2.0/templates/gitlab/appsec-compose.yml
#     # or, from a GitLab mirror:
#     # - project: security/appsec-compose
#     #   ref: v.1.2.0
#     #   file: templates/gitlab/appsec-compose.yml
#
#   appsec-compose:
#     variables:
#       APPSEC_COMPOSE_REF: v.1.2.0            # tag or commit SHA of the tool
#       APPSEC_COMPOSE_CONFIG: .gitlab/scan-config.yml
#
# The job fetches the tool at APPSEC_COMPOSE_REF next to the checkout (not
# inside it, so the tool is never scanned as part of your code), scans
# $CI_PROJECT_DIR and keeps the reports as the `appsec-reports/` artifact. The
# job's exit status is the policy verdict. Extend `.appsec-compose` to add more
# scans (e.g. one per sub-project).
#
# appsec-compose bind-mounts the repo into scanner containers, so the Docker
# daemon must see the checkout on the SAME path as the job. The reliable setup
# is a runner with the host Docker socket mounted (executor = docker with
# `volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/builds:/builds"]`,
# or a shell runner with Docker installed). Plain dind will NOT work, because
# the dind daemon cannot see $CI_PROJECT_DIR. The tool is fetched under
# $CI_BUILDS_DIR for the same reason: its per-run state is bind-mounted too.

.appsec-compose:
  image: docker:29
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APPSEC_COMPOSE_REPO: https://github.com/denimoll/appsec-compose.git
    # Branch, tag or full commit SHA. Pin a release tag or a SHA: a moving ref
    # changes the engines and the gate under you.
    APPSEC_COMPOSE_REF: v.1.2.0
    # Use an existing checkout of the tool instead of fetching one.
    APPSEC_COMPOSE_DIR: ""
    APPSEC_COMPOSE_TARGET: $CI_PROJECT_DIR
    # Relative to $CI_PROJECT_DIR. Empty = the tool's shipped defaults.
    APPSEC_COMPOSE_CONFIG: ""
    APPSEC_COMPOSE_BASELINE: ""
    # Extra run.sh flags, e.g. "--fail-on critical --strict".
    APPSEC_COMPOSE_ARGS: ""
  before_script:
    - apk add --no-cache bash git python3 py3-yaml
  script:
    - |
      tool="${APPSEC_COMPOSE_DIR:-$CI_BUILDS_DIR/appsec-compose-$CI_JOB_ID}"
      if [ -z "$APPSEC_COMPOSE_DIR" ]; then
        # init + fetch (not clone --branch) so a commit SHA works as well.
        rm -rf "$tool"
        git init -q "$tool"
        git -C "$tool" fetch -q --depth 1 "$APPSEC_COMPOSE_REPO" "$APPSEC_COMPOSE_REF"
        git -C "$tool" checkout -q FETCH_HEAD
      fi
      echo "appsec-compose $(cat "$tool/VERSION") @ $APPSEC_COMPOSE_REF"
      # GitLab caches only paths inside the project; move the DBs to the tool
      # for the scan (and back in after_script), so they are never scanned.
      if [ -d .appsec-compose-cache ]; then
        rm -rf "$tool/cache"
        mv .appsec-compose-cache "$tool/cache"
      fi
      set -- "$APPSEC_COMPOSE_TARGET" --reports "$tool/reports"
      [ -n "$APPSEC_COMPOSE_CONFIG" ] && set -- "$@" --config "$APPSEC_COMPOSE_CONFIG"
      [ -n "$APPSEC_COMPOSE_BASELINE" ] && set -- "$@" --baseline "$APPSEC_COMPOSE_BASELINE"
      # The policy verdict is the job's exit status. Reports and the cache are
      # handed back in after_script, which runs whatever this returns.
      code=0
      # shellcheck disable=SC2086
      "$tool/run.sh" "$@" $APPSEC_COMPOSE_ARGS || code=$?
      exit "$code"
  after_script:
    - |
      tool="${APPSEC_COMPOSE_DIR:-$CI_BUILDS_DIR/appsec-compose-$CI_JOB_ID}"
      rm -rf appsec-reports
      if [ -d "$tool/reports" ]; then cp -R "$tool/reports" appsec-reports; fi
      # GitLab's security reports have their own format; SARIF is rejected.
      if [ -f appsec-reports/findings.json ]; then
        python3 "$tool/scripts/gitlab-reports.py" appsec-reports/findings.json appsec-reports/gitlab
      fi
      if [ -d "$tool/cache" ]; then
        rm -rf .appsec-compose-cache
        mv "$tool/cache" .appsec-compose-cache
      fi
      if [ -z "$APPSEC_COMPOSE_DIR" ]; then rm -rf "$tool"; fi
  cache:
    key: appsec-compose-db
    paths:
      - .appsec-compose-cache/
  artifacts:
    when: always
    paths:
      - appsec-reports/
    reports:
      # GitLab's own report formats, converted from findings.json (deduped,
      # suppressions applied, stable ids) by scripts/gitlab-reports.py. The
      # security widgets and dashboards that read them are a GitLab Ultimate
      # feature; on other tiers the files are still in the artifact.
      sast:
        - appsec-reports/gitlab/gl-sast-report.json
      secret_detection:
        - appsec-reports/gitlab/gl-secret-detection-report.json
      dependency_scanning:
        - appsec-reports/gitlab/gl-dependency-scanning-report.json
      cyclonedx:
        - appsec-reports/sbom.trivy.cdx.json

appsec-compose:
  extends: .appsec-compose
  stage: test
