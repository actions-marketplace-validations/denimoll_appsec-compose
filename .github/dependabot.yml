# Actions are pinned by commit, so nothing moves on its own; this proposes the
# updates as reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new release age first: a hijacked one is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The collector's base image and the Python dependencies of the collector,
  # the MCP server and the tests. Scanner engines are not here: they are
  # moved by .github/workflows/engine-updates.yml, which also re-pins their
  # digests and runs the benchmark.
  - package-ecosystem: docker
    directory: /orchestrator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directories: [/orchestrator, /appsec_mcp, /tests]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
