name: appsec-compose scan

# Tests the collector, smoke-tests the pipeline, then scans this repository with
# the reusable action in ./action.yml — exactly what `uses:
# denimoll/appsec-compose@v1` runs in another repo: per-tool SARIF upload to
# code scanning, a reports artifact, cached vuln DBs and the policy verdict in
# the job summary.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

jobs:
  # Collector unit tests — the scan is only as trustworthy as the code that
  # normalizes, de-duplicates and gates the findings.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests/ -q

  # End-to-end: the unit tests cannot see the compose wiring, and an engine
  # whose command line breaks upstream can still exit 0 with an empty report.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache scanner DBs
        uses: actions/cache@v6
        with:
          path: cache
          key: appsec-smoke-${{ runner.os }}-${{ hashFiles('scan-config.yml') }}
          restore-keys: appsec-smoke-${{ runner.os }}-
      - run: ./scripts/smoke-test.sh

  # Dogfoods the action. This repo ships a deliberately vulnerable fixture
  # (tests/fixtures/vulnerable-repo), so the gate fails here by design; the step
  # still shows the verdict, but continue-on-error keeps the job report-only.
  # In your own repo drop continue-on-error to make the gate a hard one.
  scan:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run appsec-compose
        id: appsec
        continue-on-error: true
        uses: ./
